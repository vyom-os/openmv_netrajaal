name: '🔥 Firmware Build'

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'master'
      - 'prod'
    paths:
      - '**'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.json'
      - '!**.md'
      - '!**.rst'
      - '!**.md'
      - '!cubeai**'
      - '!scripts/examples**'
      - 'scripts/libraries/**'
      - 'scripts/unittest/**'

  pull_request:
    branches:
      - 'master'
      - 'prod'
    paths:
      - '**'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.json'
      - '!**.md'
      - '!**.rst'
      - '!**.md'
      - '!cubeai**'
      - '!scripts/examples**'
      - 'scripts/libraries/**'
      - 'scripts/unittest/**'

jobs:
  build-firmware:
    name: "${{ matrix.target }}${{ matrix.qemu && ' (QEMU)' || '' }}${{ matrix.fvp && ' (FVP)' || '' }}${{ matrix.profile == 1 && ' (PROFILE=1)' || '' }}"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - OPENMV_RT1060
        qemu: [false]
        fvp: [false]
        profile: [0]
        artifacts: [true]
      fail-fast: false
    steps:
    - name: '⏳ Checkout repository'
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: '🧱 Update submodules'
      run: source tools/ci.sh && ci_update_submodules

    - name: 'Read SDK version'
      id: sdk-ver
      run: echo "version=$(cat SDK_VERSION)" >> "$GITHUB_OUTPUT"

    - name: '♻ Cache SDK'
      uses: actions/cache@v5.0.3
      id: sdk-cache
      with:
        path: ~/openmv-sdk-${{ steps.sdk-ver.outputs.version }}
        key: openmv-sdk-${{ steps.sdk-ver.outputs.version }}-linux-x86_64

    - name: '🛠 Install dependencies'
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-arm

    - name: '🛠 Install SDK'
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      run: source tools/ci.sh && ci_install_sdk

    - name: '♻ Cache FVP'
      if: matrix.fvp
      uses: actions/cache@v5.0.3
      id: fvp-cache
      with:
        path: ~/fvp-11.31.28
        key: fvp-11.31.28-linux-x86_64

    - name: '🛠 Install FVP'
      if: matrix.fvp && steps.fvp-cache.outputs.cache-hit != 'true'
      run: source tools/ci.sh && ci_install_fvp

    - name: '🏗 Build firmware'
      run: source tools/ci.sh && ci_build_target ${{ matrix.target }} ${{ matrix.qemu }} ${{ matrix.profile }} ${{ matrix.artifacts }}

    - name: '🧪 Run QEMU tests'
      if: matrix.qemu
      run: source tools/ci.sh && ci_run_qemu_tests ${{ matrix.target }}

    - name: '🧪 Run FVP tests'
      if: matrix.fvp
      run: source tools/ci.sh && ci_run_fvp_tests ${{ matrix.target }}

    - name: 'Read firmware name'
      id: fw
      run: |
        major=$(sed -n 's/^major = \([0-9]*\).*/\1/p' scripts/libraries/config.py)
        minor=$(sed -n 's/^minor = \([0-9]*\).*/\1/p' scripts/libraries/config.py)
        patch=$(sed -n 's/^patch = \([0-9]*\).*/\1/p' scripts/libraries/config.py)
        echo "name=$(LC_ALL=C date -u +%d_%b)_RT1062FIRMWARE_${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

    - name: 'Rename firmware files'
      if: matrix.artifacts
      run: |
        name="${{ steps.fw.outputs.name }}"
        dir="${{ matrix.target }}"
        mv "$dir/firmware.bin" "$dir/${name}.bin"
        mv "$dir/firmware.elf" "$dir/${name}.elf"

    - name: '⬆ Upload artifacts'
      if: matrix.artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.fw.outputs.name }}
        path: ${{ matrix.target }}
        if-no-files-found: error

  code-size-report:
    needs: build-firmware
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
    - name: '⏳ Checkout repository'
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: 'Read SDK version'
      id: sdk-ver
      run: echo "version=$(cat SDK_VERSION)" >> "$GITHUB_OUTPUT"

    - name: '♻ Cache SDK'
      uses: actions/cache@v5.0.3
      id: sdk-cache
      with:
        path: ~/openmv-sdk-${{ steps.sdk-ver.outputs.version }}
        key: openmv-sdk-${{ steps.sdk-ver.outputs.version }}-linux-x86_64

    - name: '🛠 Install SDK'
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      run: source tools/ci.sh && ci_install_sdk

    - name: '↓ Download artifacts'
      uses: actions/download-artifact@v8
      with:
        path: new_firmware
        merge-multiple: false

    - name: '↓ Download release'
      uses: robinraju/release-downloader@v1
      with:
        repository: 'openmv/openmv'
        tag: 'development'
        fileName: 'firmware_OPENMV_RT1060.zip'
        extract: false
        out-file-path: 'old_firmware'

    - name: '📝 Generate report'
      run: |
        SDK_DIR="${HOME}/openmv-sdk-${{ steps.sdk-ver.outputs.version }}"
        export PATH="${SDK_DIR}/gcc/bin:${PATH}"
        sudo apt-get update
        sudo apt-get install -y python3-tabulate
        mkdir -p new_firmware/OPENMV_RT1060
        elf=$(find new_firmware -name '*.elf' ! -path 'new_firmware/OPENMV_RT1060/*' -print -quit)
        cp "$elf" new_firmware/OPENMV_RT1060/firmware.elf
        python3 tools/code_size.py > ${GITHUB_WORKSPACE}/${{ github.event.pull_request.number }}.md

    - name: '⬆ Upload report'
      uses: actions/upload-artifact@v7
      with:
        overwrite: true
        name: code-size-report
        path: ${{ github.event.pull_request.number }}.md
        if-no-files-found: error

  stable-release:
    needs: build-firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: '⏳ Checkout repository'
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: '↓ Download artifacts'
      uses: actions/download-artifact@v8
      with:
        path: firmware

    - name: '📦 Package firmware'
      id: rel
      run: |
        source tools/ci.sh && ci_package_firmware_release ${{github.ref_name}}
        major=$(sed -n 's/^major = \([0-9]*\).*/\1/p' scripts/libraries/config.py)
        minor=$(sed -n 's/^minor = \([0-9]*\).*/\1/p' scripts/libraries/config.py)
        patch=$(sed -n 's/^patch = \([0-9]*\).*/\1/p' scripts/libraries/config.py)
        echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
        {
          echo "notes<<NOTES"
          git log -1 --format='%B'
          echo "NOTES"
        } >> "$GITHUB_OUTPUT"

    - name: '🔥 Create stable release'
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
      with:
        draft: true
        name: ${{ steps.rel.outputs.version }}
        files: firmware_*.zip
        body: ${{ steps.rel.outputs.notes }}
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: '🧹 Remove artifacts'
      uses: geekyeggo/delete-artifact@v6
      with:
        name: firmware
        failOnError: false

  development-release:
    needs: build-firmware
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') == false)
    permissions:
      contents: write
    steps:
    - name: '⏳ Checkout repository'
      uses: actions/checkout@v6
      with:
        submodules: false
        fetch-depth: 1

    - name: '↓ Download artifacts'
      uses: actions/download-artifact@v8
      with:
        path: firmware
        pattern: '*RT1062FIRMWARE*'

    - name: '📦 Package firmware'
      id: rel
      run: |
        source tools/ci.sh && ci_package_firmware_development
        major=$(sed -n 's/^major = \([0-9]*\).*/\1/p' scripts/libraries/config.py)
        minor=$(sed -n 's/^minor = \([0-9]*\).*/\1/p' scripts/libraries/config.py)
        patch=$(sed -n 's/^patch = \([0-9]*\).*/\1/p' scripts/libraries/config.py)
        sha="${{ github.event.pull_request.head.sha || github.sha }}"
        git fetch --depth=1 origin "$sha"
        echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
        {
          echo "notes<<NOTES"
          git log -1 --format='%B' "$sha"
          echo "NOTES"
        } >> "$GITHUB_OUTPUT"

    - name: '🧹 Delete old release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="v${{ steps.rel.outputs.version }}"
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release delete "$tag" --yes --cleanup-tag
        fi

    - name: '🔥 Create development release'
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
      with:
        draft: false
        name: ${{ steps.rel.outputs.version }}
        tag_name: v${{ steps.rel.outputs.version }}
        target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
        body: ${{ steps.rel.outputs.notes }}
        files: firmware/firmware_*.zip
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: '🧹 Remove artifacts'
      uses: geekyeggo/delete-artifact@v6
      with:
        name: firmware
        failOnError: false
